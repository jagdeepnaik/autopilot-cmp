# *************************************** versions *********************************************
[versions]
jna = "5.15.0"
# --> App Configuration
# App Name to be changed inside settings.gradle.kts & IOS/Config.xcconfig
appName = "AutoPilot"
versionCode = "1"
versionName = "1.0.0"

android-minSdk = "26"
android-targetSdk = "37"
android-compileSdk = "37"
androidApplicationId = "com.jagdeep.autopilot"

# --> App Build Variants
logConfigProfile = "release"  # "debug" "release"
logDebugConfig = "console=true,file=false,har=false,keepDisplayOn=true,harCapturePlugin=true"
logReleaseConfig = "console=false,file=false,har=false,keepDisplayOn=false,harCapturePlugin=true"

foundation = "1.12.1"
runtime = "1.12.1"
ui = "1.12.1"
agp = "9.4.1"

kotlin = "2.4.21"
kotlinStdlib = "2.4.21"
kotlinx-coroutines = "1.11.0"
kotlinx-coroutines-core = "1.11.0"
core = "1.7.0"
junit = "4.13.2"
runner = "1.7.0"
ksp = "2.3.12"

composeHotReload = "1.2.0"
composeMultiplatform = "1.12.1"

androidx-activity-compose = "1.13.0"
androidx-appcompat = "1.8.0"
androidx-core = "1.19.1"
androidx-biometric = "1.1.0"
androidx-espresso = "3.7.0"
androidx-testExt = "1.3.0"

#androidx-lifecycle = "2.9.6"
androidx-lifecycle = "2.11.0"

# -->
kotlinx-datetime = "0.8.0"

# --> Logging
napier = "2.7.1"
firebaseCrashlyticsKtx = "20.0.3"

# --> Material design
material3 = "1.12.0-alpha03"
componentsResources = "1.12.1"
uiToolingPreview = "1.12.1"
materialIconsExtended = "1.7.3"

# --> Navigation
androidx-navigation3 = "1.1.2"
androidx-adaptive = "1.3.0"
androidx-navigation = "2.10.2"  # Nav 2 (Old)

# --> Serialization
kotlinx-serialization = "1.11.0"
kotlinx-serialization-core = "1.11.0"
kotlin-serialization-plugin = "2.4.21"

# --> Persistance - Needs KSP
androidx-datastore = "1.2.1"
room = "2.8.5"
sqlite = "2.7.1"
roomKtx = "2.8.5"
workManager = "2.11.2"
# realm = "3.0.0"

# --> Networking
ktor = "3.6.0"
jmdns = "3.5.10"
slf4j = "1.7.36"
logback-android = "3.0.0"
logback-classic = "1.6.5"

# --> Image loading
coil-compose-version = "3.6.3"
camerak = "1.2"
zxing = "3.5.3"
androidx-camera = "1.5.1"
qrcodeKotlin = "4.5.0"
bouncyCastle = "1.86"

# --> Dependency Injection
koin = "4.2.2"

# --> Excel parser - Needs KSP. dataframe for jvm, android
# dataframe = "1.0.0-Beta4"
# dataframe-plugin = "1.0.0-Beta4"

# *************************************** libraries *********************************************
[libraries]
jna-platform = { module = "net.java.dev.jna:jna-platform", version.ref = "jna" }
components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "componentsResources" }
foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "foundation" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-testJunit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-biometric = { module = "androidx.biometric:biometric", version.ref = "androidx-biometric" }
androidx-testExt-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-testExt" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidx-espresso" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidx-appcompat" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity-compose" }
kotlin-stdlib = { group = "org.jetbrains.kotlin", name = "kotlin-stdlib", version.ref = "kotlinStdlib" }
androidx-runner = { group = "androidx.test", name = "runner", version.ref = "runner" }
androidx-core = { group = "androidx.test", name = "core", version.ref = "core" }

# --> Couroutines
kotlinx-coroutinesSwing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines-core" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }

# --> Lifecycle
androidx-lifecycle = { module = "androidx.lifecycle:lifecycle", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtimeCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodelCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-navigation3 = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "androidx-lifecycle" }

# --> Material design
material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3" }
runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "runtime" }
ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "ui" }
ui-tooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "ui" }
ui-tooling-preview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "uiToolingPreview" }
material-icons-extended = { module = "org.jetbrains.compose.material:material-icons-extended", version.ref = "materialIconsExtended" }

# --> Navigation
androidx-navigation3-ui = { module = "org.jetbrains.androidx.navigation3:navigation3-ui", version.ref = "androidx-navigation3" }
androidx-material3-adaptive = { module = "org.jetbrains.compose.material3.adaptive:adaptive", version.ref = "androidx-adaptive" }
androidx-material3-adaptive-navigation3 = { module = "org.jetbrains.compose.material3.adaptive:adaptive-navigation3", version.ref = "androidx-adaptive" }
androidx-navigation-compose = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "androidx-navigation" } # Nav 2 (Old)

# --> Kotlinx Serialization
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlinx-serialization-core" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

# --> Logging
logging-napier = { module = "io.github.aakira:napier", version.ref = "napier" }
firebase-crashlytics-ktx = { group = "com.google.firebase", name = "firebase-crashlytics-ktx", version.ref = "firebaseCrashlyticsKtx" }

# --> Persistance
androidx-datastore = { module = "androidx.datastore:datastore", version.ref = "androidx-datastore" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "androidx-datastore" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "roomKtx" }
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "workManager" }
androidx-room-sqlite-wrapper = { module = "androidx.room:room-sqlite-wrapper", version.ref = "room" }
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }
# realm = { module = "io.realm.kotlin:library-base", version.ref = "realm" }

# --> Ktor Client (Multiplatform)
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-auth = { module = "io.ktor:ktor-client-auth", version.ref = "ktor" }
ktor-client-websockets = { module = "io.ktor:ktor-client-websockets", version.ref = "ktor" }
ktor-client-encoding = { module = "io.ktor:ktor-client-encoding", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-serialization-kotlinx-xml = { module = "io.ktor:ktor-serialization-kotlinx-xml", version.ref = "ktor" }
# --> Ktor Client Platform-specific
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-android = { module = "io.ktor:ktor-client-android", version.ref = "ktor" }
ktor-client-java = { module = "io.ktor:ktor-client-java", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
# --> Ktor Logging
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
jmdns = { module = "org.jmdns:jmdns", version.ref = "jmdns" }
#slf4j-android = { module = "org.slf4j:slf4j-android", version.ref = "slf4j" }
#slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
logback-android = { module = "com.github.tony19:logback-android", version.ref = "logback-android" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback-classic" }

# --> Image loading
coil3-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil-compose-version" }
coil3-network-ktor3 = { module = "io.coil-kt.coil3:coil-network-ktor3", version.ref = "coil-compose-version" }

# --> Cross-platform camera, QR and OCR
camerak = { module = "io.github.kashif-mehmood-km:camerak", version.ref = "camerak" }
camerak-qr-scanner = { module = "io.github.kashif-mehmood-km:qr_scanner_plugin", version.ref = "camerak" }
zxing-javase = { module = "com.google.zxing:javase", version.ref = "zxing" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
# Same CameraX version CameraK already brings in; used directly for the Android pairing scanner.
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "androidx-camera" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "androidx-camera" }
androidx-camera-view = { module = "androidx.camera:camera-view", version.ref = "androidx-camera" }
qrcode-kotlin = { module = "io.github.g0dkar:qrcode-kotlin", version.ref = "qrcodeKotlin" }
bouncycastle-prov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncyCastle" }
bouncycastle-pkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncyCastle" }


# --> Excel parser, dataframe for jvm, android
# dataframe = { module = "org.jetbrains.kotlinx:dataframe", version.ref = "dataframe" }
# dataframe-excel = { module = "org.jetbrains.kotlinx:dataframe-excel", version.ref = "dataframe" }

# --> Dependency Injection (DI)
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-test = { module = "io.insert-koin:koin-test", version.ref = "koin" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }
koin-compose-navigation3 = { module = "io.insert-koin:koin-compose-navigation3", version.ref = "koin" }

# -->
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }

